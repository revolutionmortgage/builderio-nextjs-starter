# Optional: run the site against a real Postgres on your own computer, the way it runs on
# RevStack. Not needed for everyday work: without DATABASE_URL the site uses its
# built-in database (lib/db.ts).
#
#   docker compose up --build
#
# then open http://localhost:3000.
services:
  web:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      PGSSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      retries: 30

volumes:
  postgres:
